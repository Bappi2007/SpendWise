name: SpendWise Automatic GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release version tag (e.g., v1.2.0)'
        required: true
        default: 'v1.2.0'
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish SpendWise APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ inputs.tag_name }}"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: ${TAG_NAME}"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Prepare environment configuration
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env || touch .env
          fi

      - name: Prepare debug signing keystore
        run: |
          if [ -f debug.keystore ]; then
            echo "Using existing debug.keystore"
          elif [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            base64 --decode debug.keystore.base64 > debug.keystore
          else
            echo "Generating standard Android debug.keystore..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -noprompt
          fi

      - name: Prepare and validate permanent release signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          MISSING=0
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Missing required GitHub Secret: ANDROID_KEYSTORE_BASE64"
            MISSING=1
          fi
          if [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::Missing required GitHub Secret: ANDROID_KEYSTORE_PASSWORD"
            MISSING=1
          fi
          if [ -z "${ANDROID_KEY_ALIAS:-}" ]; then
            echo "::error::Missing required GitHub Secret: ANDROID_KEY_ALIAS"
            MISSING=1
          fi
          if [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "::error::Missing required GitHub Secret: ANDROID_KEY_PASSWORD"
            MISSING=1
          fi
          if [ "$MISSING" -ne 0 ]; then
            exit 1
          fi

          mkdir -p app
          rm -f app/raw-upload-key.jks app/release-key.jks

          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d ' \t\r\n' | base64 --decode > app/raw-upload-key.jks; then
            echo "::error::Failed to base64-decode ANDROID_KEYSTORE_BASE64."
            rm -f app/raw-upload-key.jks
            exit 1
          fi

          if [ ! -s app/raw-upload-key.jks ]; then
            echo "::error::Decoded keystore file is empty."
            rm -f app/raw-upload-key.jks
            exit 1
          fi

          if ! keytool -list -keystore app/raw-upload-key.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Keystore validation failed: unable to read alias specified by ANDROID_KEY_ALIAS using ANDROID_KEYSTORE_PASSWORD."
            rm -f app/raw-upload-key.jks
            exit 1
          fi

          # Normalize the validated private key entry into app/release-key.jks under alias 'upload'
          # so app/build.gradle.kts signingConfigs.release can read it deterministically.
          if ! keytool -importkeystore \
            -srckeystore app/raw-upload-key.jks \
            -destkeystore app/release-key.jks \
            -deststoretype JKS \
            -srcalias "$ANDROID_KEY_ALIAS" \
            -destalias upload \
            -srcstorepass "$ANDROID_KEYSTORE_PASSWORD" \
            -deststorepass "$ANDROID_KEYSTORE_PASSWORD" \
            -srckeypass "$ANDROID_KEY_PASSWORD" \
            -destkeypass "$ANDROID_KEY_PASSWORD" \
            -noprompt >/dev/null 2>&1; then
            echo "::error::Failed to unlock private key using ANDROID_KEY_PASSWORD for the configured ANDROID_KEY_ALIAS."
            rm -f app/raw-upload-key.jks app/release-key.jks
            exit 1
          fi

          rm -f app/raw-upload-key.jks
          echo "Permanent release keystore validated and prepared successfully."

      - name: Build Debug and Release APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/release-key.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Verify APK outputs and prepare release assets
        id: assets
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag_name }}"
          mkdir -p release-assets

          RELEASE_APK=$(find app/build/outputs/apk/release -maxdepth 2 -name "*.apk" | head -n 1)
          DEBUG_APK=$(find app/build/outputs/apk/debug -maxdepth 2 -name "*.apk" | head -n 1)

          if [ -z "$RELEASE_APK" ] || [ ! -f "$RELEASE_APK" ]; then
            echo "::error::Release APK was not found in app/build/outputs/apk/release/"
            exit 1
          fi

          if [ -z "$DEBUG_APK" ] || [ ! -f "$DEBUG_APK" ]; then
            echo "::error::Debug APK was not found in app/build/outputs/apk/debug/"
            exit 1
          fi

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT/build-tools" ]; then
            echo "::error::ANDROID_HOME/build-tools directory not found."
            exit 1
          fi

          APKSIGNER=$(find "$SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner executable not found under $SDK_ROOT/build-tools/"
            exit 1
          fi

          echo "Using apksigner: $APKSIGNER"
          VERIFY_OUTPUT=$("$APKSIGNER" verify --verbose --print-certs "$RELEASE_APK")
          echo "$VERIFY_OUTPUT"

          CERT_SHA256=$(printf '%s\n' "$VERIFY_OUTPUT" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}')
          if [ -z "$CERT_SHA256" ]; then
            echo "::error::Failed to extract Signer #1 certificate SHA-256 digest from apksigner output."
            exit 1
          fi

          echo "Signing certificate SHA-256 fingerprint: $CERT_SHA256"

          RELEASE_ASSET="SpendWise-${TAG}-release.apk"
          DEBUG_ASSET="SpendWise-${TAG}-debug.apk"

          cp "$RELEASE_APK" "release-assets/${RELEASE_ASSET}"
          cp "$DEBUG_APK" "release-assets/${DEBUG_ASSET}"

          cd release-assets
          sha256sum "${RELEASE_ASSET}" "${DEBUG_ASSET}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

          echo "release_asset=${RELEASE_ASSET}" >> "$GITHUB_OUTPUT"
          echo "debug_asset=${DEBUG_ASSET}" >> "$GITHUB_OUTPUT"

      - name: Upload workflow build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SpendWise-${{ steps.version.outputs.tag_name }}-APKs
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

      - name: Generate Release Notes summary
        id: notes
        run: |
          TAG="${{ steps.version.outputs.tag_name }}"
          RELEASE_ASSET="${{ steps.assets.outputs.release_asset }}"
          DEBUG_ASSET="${{ steps.assets.outputs.debug_asset }}"

          cat <<EOF > release-notes.md
          ## 📥 Download SpendWise (${TAG})

          | Variant | File | Description |
          | :--- | :--- | :--- |
          | **Release APK (Recommended)** | \`${RELEASE_ASSET}\` | Production-signed release build for everyday use on Android 8.0+ (API 26+) devices. |
          | **Debug APK** | \`${DEBUG_ASSET}\` | Debuggable build for development, inspection, and testing. |
          | **SHA-256 Checksums** | \`SHA256SUMS.txt\` | Cryptographic SHA-256 hashes to verify APK file integrity. |

          ### 🔐 APK Signing Status
          ✅ **Signed Production Release**: Signed using the repository's permanent release keystore configured in GitHub Actions Secrets (`ANDROID_KEYSTORE_BASE64`). Supports seamless in-place **Update** across releases.

          ### 📲 How to Install on Android
          1. Download **\`${RELEASE_ASSET}\`** from the **Assets** section below on your Android phone.
          2. Open the downloaded `.apk` file from your notification bar or **Files / Downloads** app.
          3. If prompted, allow **Install unknown apps** for your browser or file manager.
          4. Tap **Install** and open **SpendWise**.
          EOF

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: SpendWise ${{ steps.version.outputs.tag_name }}
          body_path: release-notes.md
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag_name, '-alpha') || contains(steps.version.outputs.tag_name, '-beta') || contains(steps.version.outputs.tag_name, '-rc') }}
          overwrite_files: true
          files: |
            release-assets/${{ steps.assets.outputs.release_asset }}
            release-assets/${{ steps.assets.outputs.debug_asset }}
            release-assets/SHA256SUMS.txt

      - name: Clean up temporary signing keystores
        if: always()
        run: |
          rm -f app/raw-upload-key.jks app/release-key.jks
          git checkout -- debug.keystore 2>/dev/null || rm -f debug.keystore
