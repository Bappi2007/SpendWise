name: SpendWise Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Prepare environment files
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env || touch .env
          fi

      - name: Prepare debug keystore for debugConfig initialization
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 --decode debug.keystore.base64 > debug.keystore
          fi

      - name: Prepare and validate permanent release signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          MISSING=0
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Missing required GitHub Secret: ANDROID_KEYSTORE_BASE64"
            MISSING=1
          fi
          if [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::Missing required GitHub Secret: ANDROID_KEYSTORE_PASSWORD"
            MISSING=1
          fi
          if [ -z "${ANDROID_KEY_ALIAS:-}" ]; then
            echo "::error::Missing required GitHub Secret: ANDROID_KEY_ALIAS"
            MISSING=1
          fi
          if [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "::error::Missing required GitHub Secret: ANDROID_KEY_PASSWORD"
            MISSING=1
          fi
          if [ "$MISSING" -ne 0 ]; then
            exit 1
          fi

          mkdir -p app
          rm -f app/raw-upload-key.jks app/release-key.jks

          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d ' \t\r\n' | base64 --decode > app/raw-upload-key.jks; then
            echo "::error::Failed to base64-decode ANDROID_KEYSTORE_BASE64."
            rm -f app/raw-upload-key.jks
            exit 1
          fi

          if [ ! -s app/raw-upload-key.jks ]; then
            echo "::error::Decoded keystore file is empty."
            rm -f app/raw-upload-key.jks
            exit 1
          fi

          if ! keytool -list -keystore app/raw-upload-key.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Keystore validation failed: unable to read alias specified by ANDROID_KEY_ALIAS using ANDROID_KEYSTORE_PASSWORD."
            rm -f app/raw-upload-key.jks
            exit 1
          fi

          # Normalize the validated private key entry into app/release-key.jks under alias 'upload'
          # so app/build.gradle.kts signingConfigs.release can read it deterministically.
          if ! keytool -importkeystore \
            -srckeystore app/raw-upload-key.jks \
            -destkeystore app/release-key.jks \
            -deststoretype JKS \
            -srcalias "$ANDROID_KEY_ALIAS" \
            -destalias upload \
            -srcstorepass "$ANDROID_KEYSTORE_PASSWORD" \
            -deststorepass "$ANDROID_KEYSTORE_PASSWORD" \
            -srckeypass "$ANDROID_KEY_PASSWORD" \
            -destkeypass "$ANDROID_KEY_PASSWORD" \
            -noprompt >/dev/null 2>&1; then
            echo "::error::Failed to unlock private key using ANDROID_KEY_PASSWORD for the configured ANDROID_KEY_ALIAS."
            rm -f app/raw-upload-key.jks app/release-key.jks
            exit 1
          fi

          rm -f app/raw-upload-key.jks
          echo "Permanent release keystore validated and prepared successfully."

      - name: Build signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/release-key.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify Release APK signature with apksigner
        run: |
          set -euo pipefail

          RELEASE_APK=$(find app/build/outputs/apk/release -maxdepth 2 -name "*.apk" | head -n 1)
          if [ -z "$RELEASE_APK" ] || [ ! -f "$RELEASE_APK" ]; then
            echo "::error::Release APK was not found in app/build/outputs/apk/release/"
            exit 1
          fi

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT/build-tools" ]; then
            echo "::error::ANDROID_HOME/build-tools directory not found."
            exit 1
          fi

          APKSIGNER=$(find "$SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner executable not found under $SDK_ROOT/build-tools/"
            exit 1
          fi

          echo "Using apksigner: $APKSIGNER"
          VERIFY_OUTPUT=$("$APKSIGNER" verify --verbose --print-certs "$RELEASE_APK")
          echo "$VERIFY_OUTPUT"

          CERT_SHA256=$(printf '%s\n' "$VERIFY_OUTPUT" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}')
          if [ -z "$CERT_SHA256" ]; then
            echo "::error::Failed to extract Signer #1 certificate SHA-256 digest from apksigner output."
            exit 1
          fi

          echo "Signing certificate SHA-256 fingerprint: $CERT_SHA256"
          echo "Verified signed Release APK: $RELEASE_APK"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SpendWise-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing keystores
        if: always()
        run: |
          rm -f app/raw-upload-key.jks app/release-key.jks
          git checkout -- debug.keystore 2>/dev/null || rm -f debug.keystore
